<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1026">
<meta name="mobile-web-app-capable" content="yes">
<title>The Last Summer Sun — Chapter I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4e9d8; --dim:#c7b39a; --gold:#e8b36a; --rose:#d97f76; --plum:#241228;
  --hair:rgba(244,233,216,.28);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#120a18;overscroll-behavior:none;}
body{font-family:'Inter',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .9s ease;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));}
.screen.show{opacity:1;pointer-events:auto;}

/* ---------- title ---------- */
#title{background:
  radial-gradient(ellipse 90% 55% at 72% 68%, rgba(232,179,106,.20), transparent 60%),
  radial-gradient(ellipse 70% 45% at 30% 30%, rgba(217,127,118,.12), transparent 65%),
  linear-gradient(180deg,#2b1b3f 0%,#4a2c4e 34%,#83495c 62%,#c96f52 84%,#e89a5e 100%);}
#title .sun{position:absolute;left:72%;top:66%;width:44vmin;height:44vmin;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#fff3d9 0%,#ffd9a0 22%,rgba(255,178,102,.42) 45%,transparent 70%);
  filter:blur(2px);animation:sunbreath 7s ease-in-out infinite;}
@keyframes sunbreath{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.92}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}
.title-kicker{font-size:11px;letter-spacing:.42em;font-weight:600;color:var(--gold);text-transform:uppercase;opacity:0;transform:translateY(14px);transition:all 1.1s cubic-bezier(.22,1,.36,1) .3s;}
.title-main{font-family:'Cormorant Garamond',serif;font-weight:600;font-style:italic;font-size:clamp(38px,9vw,84px);line-height:1.04;margin-top:18px;letter-spacing:.01em;
  text-shadow:0 2px 30px rgba(20,8,25,.55);opacity:0;transform:translateY(18px);transition:all 1.2s cubic-bezier(.22,1,.36,1) .55s;}
.title-chapter{margin-top:16px;font-weight:300;font-size:clamp(12px,2.4vw,15px);letter-spacing:.34em;text-transform:uppercase;color:var(--ink);
  opacity:0;transform:translateY(14px);transition:all 1.1s cubic-bezier(.22,1,.36,1) .85s;}
.title-rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--hair),transparent);margin:26px 0 30px;opacity:0;transition:opacity 1s ease 1.05s;}
#title.show .title-kicker,#title.show .title-main,#title.show .title-chapter,#title.show .title-rule{opacity:1;transform:none;}
.btn-row{display:flex;flex-direction:column;gap:14px;align-items:center;opacity:0;transform:translateY(14px);transition:all 1.1s cubic-bezier(.22,1,.36,1) 1.2s;}
#title.show .btn-row{opacity:1;transform:none;}
.btn{font-family:'Inter',sans-serif;font-weight:400;font-size:13px;letter-spacing:.30em;text-transform:uppercase;color:var(--ink);
  background:rgba(20,10,26,.32);border:1px solid var(--hair);border-radius:999px;padding:15px 46px;cursor:pointer;min-width:230px;
  backdrop-filter:blur(6px);transition:border-color .35s,background .35s,color .35s,transform .12s;}
.btn:hover{border-color:rgba(232,179,106,.75);background:rgba(232,179,106,.12);}
.btn:active{transform:scale(.96);}
.btn.primary{border-color:rgba(232,179,106,.65);}
.btn[disabled]{opacity:.38;cursor:default;}
.btn[disabled]:hover{border-color:var(--hair);background:rgba(20,10,26,.32);}
.title-foot{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:rgba(244,233,216,.5);
  opacity:0;transition:opacity 1.4s ease 1.6s;}
#title.show .title-foot{opacity:1;}
#load-note{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,233,216,.65);animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ---------- pause ---------- */
#pause{background:rgba(14,8,20,.55);backdrop-filter:blur(10px);}
.pause-card{display:flex;flex-direction:column;gap:12px;align-items:center;}
.pause-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:30px;margin-bottom:14px;color:var(--ink);}

/* ---------- chapter end ---------- */
#endcard{background:radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255,214,150,.16), transparent 70%),linear-gradient(180deg,rgba(20,10,26,.88),rgba(43,27,63,.94));}
.end-kicker{font-size:11px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);opacity:0;transform:translateY(12px);transition:all 1s ease .4s;}
.end-main{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(32px,7vw,60px);margin-top:14px;opacity:0;transform:translateY(14px);transition:all 1.1s ease .7s;}
.end-motes{margin-top:20px;font-weight:300;font-size:14px;letter-spacing:.22em;color:var(--dim);opacity:0;transition:opacity 1s ease 1.1s;}
.end-note{margin-top:6px;font-weight:300;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(244,233,216,.55);opacity:0;transition:opacity 1s ease 1.3s;}
#endcard.show .end-kicker,#endcard.show .end-main,#endcard.show .end-motes,#endcard.show .end-note{opacity:1;transform:none;}
#endcard .btn-row{opacity:0;transition:opacity 1s ease 1.5s;}
#endcard.show .btn-row{opacity:1;}

/* ---------- chapter toast ---------- */
#chapter-toast{position:fixed;left:0;right:0;top:22%;z-index:9;text-align:center;pointer-events:none;
  opacity:0;transform:translateY(16px);transition:opacity 1.4s cubic-bezier(.22,1,.36,1),transform 1.4s cubic-bezier(.22,1,.36,1);}
#chapter-toast.show{opacity:1;transform:none;}
#chapter-toast .ct-num{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:clamp(40px,10vw,92px);color:rgba(244,233,216,.85);text-shadow:0 2px 34px rgba(10,5,18,.7);line-height:1;}
#chapter-toast .ct-name{display:block;margin-top:8px;font-weight:300;font-size:clamp(12px,2.6vw,15px);
  letter-spacing:.42em;text-transform:uppercase;color:rgba(244,233,216,.72);}

/* ---------- corner hint chips ---------- */
.chip{position:fixed;z-index:12;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(244,233,216,.66);
  background:rgba(18,10,24,.35);border:1px solid var(--hair);border-radius:999px;padding:7px 14px;backdrop-filter:blur(4px);
  pointer-events:none;opacity:0;transition:opacity .8s ease;}
.chip.show{opacity:1;}
#chip-pause{top:max(14px,env(safe-area-inset-top));right:16px;}
#chip-rotate{top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);}

/* ---------- touch hints ---------- */
.touch-hint{position:fixed;bottom:max(26px,calc(env(safe-area-inset-bottom) + 18px));width:58px;height:58px;border-radius:50%;z-index:11;
  border:1px solid rgba(244,233,216,.30);background:rgba(20,10,26,.22);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;color:rgba(244,233,216,.8);font-size:20px;
  opacity:0;transition:opacity .6s ease;pointer-events:none;}
.touch-hint.show{opacity:.85;}
#hint-left{left:max(20px,env(safe-area-inset-left) + 18px);}
#hint-right{right:max(20px,env(safe-area-inset-right) + 18px);}
#hint-jump{left:50%;transform:translateX(-50%);bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));width:64px;height:40px;border-radius:999px;font-size:11px;letter-spacing:.2em;}

#nogl{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:#160d1e;padding:30px;text-align:center;font-size:14px;line-height:1.7;color:var(--dim);}
@media (max-width:520px){ .btn{min-width:200px;padding:13px 34px;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="title" class="screen">
  <div class="sun"></div>
  <div class="title-kicker">A Roozshomar Story</div>
  <div class="title-main">The Last<br>Summer Sun</div>
  <div class="title-chapter">Chapter I · Market of Memories</div>
  <div class="title-rule"></div>
  <div class="btn-row" id="title-buttons">
    <div id="load-note">painting the world…</div>
  </div>
  <div class="title-foot">headphones recommended · a wordless journey</div>
</div>

<div id="pause" class="screen">
  <div class="pause-card">
    <div class="pause-title">paused</div>
    <button class="btn primary" id="btn-resume">Resume</button>
    <button class="btn" id="btn-restart">Restart Chapter</button>
    <button class="btn" id="btn-sound">Sound · On</button>
    <button class="btn" id="btn-exit">Return to Roozshomar</button>
  </div>
</div>

<div id="endcard" class="screen">
  <div class="end-kicker">Chapter complete</div>
  <div class="end-main" id="end-title">…</div>
  <div class="end-motes" id="end-motes">0 / 0 memories gathered</div>
  <div class="end-note" id="end-note">…</div>
  <div style="height:26px"></div>
  <div class="btn-row" style="transition-delay:1.5s">
    <button class="btn primary" id="btn-next">Continue</button>
    <button class="btn" id="btn-replay">Replay Chapter</button>
    <button class="btn" id="btn-home">Return to Roozshomar</button>
  </div>
</div>

<div id="chapter-toast"><span class="ct-num"></span><span class="ct-name"></span></div>

<div class="chip" id="chip-pause">❙❙</div>
<div class="chip" id="chip-rotate">best in landscape</div>
<div class="touch-hint" id="hint-left">◀</div>
<div class="touch-hint" id="hint-right">▶</div>
<div class="touch-hint" id="hint-jump">JUMP</div>

<div id="nogl"><div>This journey needs WebGL2.<br>Please try a recent Chrome, Firefox or Safari.</div></div>

<script src="src/game/glcore.js"></script>
<script src="src/game/shaders.js"></script>
<script src="src/game/sprites.js"></script>
<script src="src/game/audio.js"></script>
<script src="src/game/input.js"></script>
<script src="src/game/particles.js"></script>
<script src="src/game/world.js"></script>
<script src="src/game/player.js"></script>
<script src="src/game/fx.js"></script>
<script src="src/game/ui.js"></script>
<script src="src/game/engine.js"></script>
<script src="src/game/main.js"></script>
</body>
</html>
